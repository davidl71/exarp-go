---
# Production environment variables

# Go configuration (use "latest" for latest stable, or pin e.g. "1.25.6")
go_version: "latest"
go_install_path: "/usr/local/go"
go_user: "deploy"
go_gopath: "/home/{{ go_user }}/go"
go_bin_path: "/home/{{ go_user }}/go/bin"

# Project configuration
project_name: "exarp-go"
project_path: "/opt/{{ project_name }}"
project_user: "deploy"

# Optional tools (production typically doesn't need linters)
install_linters: false
install_dev_tools: false
install_file_watchers: false
install_gh: false  # GitHub CLI (gh) - optional, useful for release management and authenticated operations
install_ollama: false  # Ollama - not needed in production
install_redis: false   # Redis - not needed in production
install_build_tools: false  # C/C++ build tools - not needed for pure-Go production binary
install_protobuf: false     # Protocol Buffers - not needed for production

# Linter configuration (empty for production)
linters: []

# Development tools (empty for production)
dev_tools: []
