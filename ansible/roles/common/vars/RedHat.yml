---
# RedHat/CentOS-specific variables
_pkg_manager: dnf
_root_group: root
_shell_rc_name: .bashrc
_ca_bundle_path: /etc/pki/tls/certs/ca-bundle.crt
_base_packages:
  - ca-certificates
  - curl
  - wget
  - git
_build_packages:
  - gcc
  - gcc-c++
  - make
  - pkgconfig
  - glibc-devel
_protobuf_packages:
  - protobuf-compiler
  - protobuf-devel
_sqlite_packages:
  - sqlite
  - sqlite-devel
