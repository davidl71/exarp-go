---
# macOS-specific variables
_pkg_manager: homebrew
_root_group: wheel
_shell_rc_name: .zshrc
_ca_bundle_path: /etc/ssl/cert.pem
_base_packages:
  - curl
  - wget
  - git
_build_packages: []  # macOS Xcode provides gcc/clang via Command Line Tools
_protobuf_packages:
  - protobuf
_sqlite_packages: []  # macOS ships with SQLite
