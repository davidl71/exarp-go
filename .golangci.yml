# golangci-lint configuration for exarp-go
# See https://golangci-lint.run/usage/configuration/ for full documentation

version: 2

run:
  # Timeout for analysis
  timeout: 5m
  
  # Include test files
  tests: true

# Issues configuration
issues:
  # Exclude directories
  exclude-dirs:
    - vendor
    - .git
    - bin
    - .exarp
    - .todo2
    - project_management_automation/__pycache__
    - bridge/__pycache__
    - tests/fixtures
  
  # Exclude files
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  
  # Maximum issues count per one linter
  max-issues-per-linter: 50
  
  # Maximum count of issues with the same text
  max-same-issues: 3

  # Exclude specific issues
  exclude-rules:
    - path: internal/tools/handlers\.go
      linters:
        - dupl
      text: "lines are duplicate"
    - path: internal/tools/handlers.go
      linters:
        - err113
      text: "do not define dynamic errors"
    # deadcode: exclude functions that are called via interfaces, reflection, or tests
    - linters:
        - staticcheck
      text: "unused func"
      path: ".*_test\\.go$"
    # deadcode: exclude test fixtures and mock utilities (called via reflection)
    - linters:
        - staticcheck
      text: "unused func \\(Producer\\.EnqueueTask\\)"
      path: "internal/queue/producer\\.go"
    # deadcode: exclude public API functions that may be called externally
    - linters:
        - staticcheck
      text: "unused func \\(AccessControl\\.(AllowTool|AllowResource|DenyResource|CheckResource)\\)"
      path: "internal/security/access\\.go"
    - linters:
        - staticcheck
      text: "unused func CheckResourceAccess"
      path: "internal/security/access\\.go"
    # deadcode: exclude context helpers that are part of public API
    - linters:
        - staticcheck
      text: "unused func Context(Sampler|Roots)"
      path: "internal/framework/server\\.go"
    # deadcode: exclude builder methods (optional API)
    - linters:
        - staticcheck
      text: "unused func \\(CreateMessageParams\\.(AddAssistantMessage|AddSystemMessage|WithPreferences|WithPriority)\\)"
      path: "internal/framework/server\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(SamplingMessage\\.(WithContent|WithRole)\\)"
      path: "internal/framework/server\\.go"
    # deadcode: exclude functions only called from tests (excluded from main build)
    - linters:
        - staticcheck
      text: "unused func \\(GetCommentsByType|DeleteComment|GetCommentsWithTypeFilter\\)"
      path: "internal/database/comments\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(RenewLease|RunLeaseRenewal|CleanupExpiredLocks\\)"
      path: "internal/database/tasks_lock\\.go"
    - linters:
        - staticcheck
      text: "unused func GetDependents"
      path: "internal/database/tasks_misc\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(IsVersionMismatchError|CheckUpdateConflict\\)"
      path: "internal/database/tasks_crud\\.go"
    - linters:
        - staticcheck
      text: "unused func GetTasksByTag"
      path: "internal/database/tasks_list\\.go"
    - linters:
        - staticcheck
      text: "unused func GetCurrentVersion"
      path: "internal/database/migrations\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(GetLockStatus|CleanupExpiredLocksWithReport\\)"
      path: "internal/database/lock_monitoring\\.go"
    - linters:
        - staticcheck
      text: "unused func GetDefaultDSN"
      path: "internal/database/config\\.go"
    # deadcode: exclude factory functions called by test files
    - linters:
        - staticcheck
      text: "unused func WithHooks"
      path: "internal/factory/server\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(newCompletionHandler|completionCandidates|refTargetIsResource|applyPrefixFilter\\)"
      path: "internal/factory/capabilities\\.go"
    # deadcode: exclude test-only helper functions
    - linters:
        - staticcheck
      text: "unused func \\(GetAgentRunner|RunAgent|GetAvailableRunners\\)"
      path: "internal/tools/agent_runner\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(EstimateTokensWithConfig|scoreTasksHeuristic\\)"
      path: "internal/tools/context\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(IsPendingStatusNormalized|IsCompletedStatusNormalized|IsActiveStatusNormalized|IsReviewStatusNormalized\\)"
      path: "internal/tools/normalization\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(DetectCppProject|DetectSwiftProject\\)"
      path: "internal/tools/scorecard_multilang\\.go"
    - linters:
        - staticcheck
      text: "unused func handleServerStatusNative"
      path: "internal/tools/server_status\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(AnalyzeTask|parseTaskBreakdown|extractJSON\\)"
      path: "internal/tools/task_analyzer\\.go"
    - linters:
        - staticcheck
      text: "unused func ListToolNames"
      path: "internal/tools/tool_catalog\\.go"
    - linters:
        - staticcheck
      text: "unused func \\(WithResourceUpdateContext|ResourceUpdates\\)"
      path: "internal/tools/resource_notifications\\.go"
    - linters:
        - staticcheck
      text: "unused func ListTrackedResourceURIs"
      path: "internal/tools/resources_as_tools\\.go"
    - linters:
        - staticcheck
      text: "unused func RecommendGPULayers"
      path: "internal/tools/llamacpp_gpu\\.go"
    - linters:
        - staticcheck
      text: "unused func SerializeTaskToProtobufJSON"
      path: "internal/models/todo2_protobuf\\.go"
    - linters:
        - staticcheck
      text: "unused func DeserializeTaskFromProtobufJSON"
      path: "internal/models/todo2_protobuf\\.go"
    # deadcode: exclude test fixtures (external packages may call these)
    - linters:
        - staticcheck
      text: "unused func"
      path: "tests/fixtures/mock_server\\.go"
    - linters:
        - staticcheck
      text: "unused func"
      path: "tests/fixtures/test_helpers\\.go"
    # deadcode: exclude CLI/TUI dead code (interactive, not detectable)
    - linters:
        - staticcheck
      text: "unused func adaptiveColor"
      path: "internal/cli/tui_styles\\.go"
    - linters:
        - staticcheck
      text: "unused func model\\.viewHelp"
      path: "internal/cli/tui_scorecard\\.go"
    # deadcode: exclude archive functions (may be called by CLI)
    - linters:
        - staticcheck
      text: "unused func \\(ExpiredCategories|DeleteExpired\\)"
      path: "internal/archive/retention\\.go"
    # deadcode: exclude vector/web utilities (may be called externally)
    - linters:
        - staticcheck
      text: "unused func \\(TextFallbackStore\\.(Available|AddAll|Search)|FS\\)"
      path: "internal/vector/text_fallback\\.go"
    - linters:
        - staticcheck
      text: "unused func FS"
      path: "internal/web/serve\\.go"
    # deadcode: exclude ValidatePathExists (used by security tests)
    - linters:
        - staticcheck
      text: "unused func ValidatePathExists"
      path: "internal/security/path\\.go"
    # deadcode: exclude AllowRequest (wrapper for vendor)
    - linters:
        - staticcheck
      text: "unused func AllowRequest"
      path: "internal/security/ratelimit\\.go"
    # deadcode: test file exclusions (untyped patterns)
    - linters:
        - staticcheck
      text: "benchmarkModelRouter.SelectModel"
      path: "internal/tools/model_router_bench_test\\.go"
    - linters:
        - staticcheck
      text: "generateSortedTestData"
      path: "internal/tools/statistics_bench_test\\.go"
    - linters:
        - staticcheck
      text: "TestContext"
      path: "tests/fixtures/test_helpers\\.go"
    - linters:
        - staticcheck
      text: "JSONRPCRequest|JSONRPCResponse|JSONRPCError"
      path: "tests/fixtures/test_helpers\\.go"
    # deadcode: fix remaining path-only rules
    - linters:
        - staticcheck
      text: "adaptiveColor"
      path: "internal/cli/tui_styles\\.go"
    - linters:
        - staticcheck
      text: "GetDefaultDSN"
      path: "internal/database/config\\.go"
    - linters:
        - staticcheck
      text: "CleanupExpiredLocksWithReport"
      path: "internal/database/lock_monitoring\\.go"
    - linters:
        - staticcheck
      text: "ContextWithRoots"
      path: "internal/framework/server\\.go"
    - linters:
        - staticcheck
      text: "GetAgentRunner|RunAgent|GetAvailableRunners"
      path: "internal/tools/agent_runner\\.go"
    - linters:
        - staticcheck
      text: "DetectCppProject|DetectSwiftProject"
      path: "internal/tools/scorecard_multilang\\.go"
    - linters:
        - staticcheck
      text: "TextFallbackStore"
      path: "internal/vector/text_fallback\\.go"
    - linters:
        - staticcheck
      text: "func FS"
      path: "internal/web/serve\\.go"

# Output configuration
output:
  # Colored output
  colored: true
  
  # Print linter name in issue line
  print-issued-lines: true
  
  # Print linter name in unused line
  print-linter-name: true

# Linters configuration
linters:
  # Enable specific linters
  enable:
    - errcheck          # Check for unchecked errors
    - govet             # Go vet
    - ineffassign       # Detect unused assignments
    - staticcheck       # Static analysis (includes deadcode)
    - unused            # Unused code detection
    - misspell          # Spelling checker
    - unconvert         # Remove unnecessary conversions
    - unparam           # Unused parameters
    - gocritic          # Go code critic
    - revive            # Fast, configurable linter
    - copyloopvar       # Detect copying loop variables (replaces exportloopref)
    - gosec             # Security issues
    - gocognit          # Cognitive complexity
    - dupl              # Code duplication
    - errname           # Error naming
    - errorlint         # Error wrapping
    - err113            # Error handling (replaces goerr113)
    - exhaustive        # Exhaustive switch statements
    - funlen            # Function length
    - gochecknoglobals  # Check for global variables
    - gochecknoinits    # Check for init functions
    - goconst           # Constant detection
    - gocyclo           # Cyclomatic complexity
    - godot             # Comment formatting
    - godox             # TODO/BUG/FIXME comments
    - mnd               # Magic number detection (replaces gomnd)
    - goprintffuncname  # Printf function name
    - importas          # Import alias checking
    - lll               # Line length
    - makezero          # Make zero length slices
    - nakedret          # Naked returns
    - noctx             # Context passing
    - nolintlint        # Lint nolint directives
    - prealloc          # Preallocate slices
    - predeclared       # Predeclared identifiers
    - rowserrcheck      # Rows error checking
    - sqlclosecheck     # SQL close checking
    - tagliatelle       # Struct tag checking
    - usetesting        # Testing environment (replaces tenv)
    - thelper           # Test helper detection
    - tparallel         # Parallel tests
    - varnamelen        # Variable name length
    - whitespace        # Whitespace checking
    - wrapcheck         # Error wrapping
    - wsl_v5            # Whitespace lines

# Linters settings
linters-settings:
  errcheck:
    # Report about not checking of errors in type assertions
    check-type-assertions: true
    # Report about assignment of errors to blank identifier
    check-blank: true
    # Report about not checking of errors in if conditions
    check-asserts: true

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc

  gocyclo:
    # Minimal code complexity to report
    min-complexity: 15

  dupl:
    # Tokens count to trigger issue
    threshold: 100

  funlen:
    lines: 100
    statements: 50

  goconst:
    # Minimal length of string constant
    min-len: 3
    # Minimum occurrences of constant string count to trigger issue
    min-occurrences: 3

  gocognit:
    # Minimal code complexity to report
    min-complexity: 15

  godot:
    # Check comments starting from the 3rd comment line
    min-len: 3
    # Check all comments (top-level and non-top-level)
    scope: all

  goimports:
    # Put imports beginning with prefix after 3rd-party packages
    local-prefixes: github.com/davidl71/exarp-go

  govet:
    # Enable all analyzers
    enable-all: true

  lll:
    # Max line length, lines longer will be reported
    line-length: 140

  misspell:
    # Correct spellings using locale preferences for US or UK
    locale: US

  nolintlint:
    # Enable to ensure that nolint directives are all used
    allow-unused: false
    # Require an explanation for nolint directives
    require-explanation: false

  revive:
    # Sets the default failure confidence
    min-confidence: 0
    # Sets the default severity
    severity: warning
    # Enable or disable rules
    rules:
      - name: exported
        severity: warning
      - name: error-return
        severity: warning
      - name: error-naming
        severity: warning
      - name: var-naming
        severity: warning
      - name: range
        severity: warning
      - name: receiver-naming
        severity: warning
      - name: unexported-naming
        severity: warning
      - name: var-declaration
        severity: warning
      - name: range-val-in-closure
        severity: warning
      - name: range-val-address
        severity: warning
      - name: waitgroup-by-value
        severity: warning
      - name: atomic
        severity: warning
      - name: empty-lines
        severity: warning
      - name: line-length-limit
        severity: warning
      - name: duplicated-imports
        severity: warning
      - name: import-shadowing
        severity: warning
      - name: bare-return
        severity: warning
      - name: unused-parameter
        severity: warning
      - name: unhandled-error
        severity: warning
      - name: cognitive-complexity
        severity: warning
      - name: early-return
        severity: warning
      - name: indent-error-flow
        severity: warning
      - name: errorf
        severity: warning
      - name: empty-block
        severity: warning
      - name: superfluous-else
        severity: warning
      - name: unreachable-code
        severity: warning

  wsl_v5:
    allow-first-in-block: true
    allow-whole-block: false
    branch-max-lines: 2
