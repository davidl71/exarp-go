syntax = "proto3";

package exarp.bridge;

option go_package = "github.com/davidl71/exarp-go/proto";

// ToolRequest represents a request to execute a tool through a bridge process.
// This schema is primarily used for Go↔Python bridge communication.
message ToolRequest {
  string tool_name = 1;
  bytes args_json = 2; // JSON-encoded args payload
  bool output_json = 3; // whether the caller expects JSON output
}

// ToolResponse represents the tool execution result returned by the bridge.
message ToolResponse {
  bool success = 1;
  string error = 2;
  bytes result_json = 3; // JSON-encoded tool result payload
}

// ResourceRequest represents a request to fetch a resource through a bridge.
message ResourceRequest {
  string uri = 1;
}

// ResourceResponse represents a resource fetch result returned by the bridge.
message ResourceResponse {
  bool success = 1;
  string error = 2;
  bytes content = 3;
  string mime_type = 4;
}

