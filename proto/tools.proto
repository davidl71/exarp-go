syntax = "proto3";

package exarp.tools;

option go_package = "github.com/davidl71/exarp-go/proto";

import "google/protobuf/timestamp.proto";

// OutputFormat is a shared output formatting selector used across tools.
// Keep string fields for compatibility; internal code should prefer output_format_enum.
enum OutputFormat {
  OUTPUT_FORMAT_UNSPECIFIED = 0;
  OUTPUT_FORMAT_TEXT = 1;
  OUTPUT_FORMAT_MARKDOWN = 2;
  OUTPUT_FORMAT_JSON = 3;
}

